:root{
  --navy:#103b5b;--blue:#0f6fa8;--teal:#15977f;--green:#2d9867;

*{box-sizing:border-box} html{background:var(--bg)}
body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--text);background:var(--bg)}
button,input,select{font:inherit}
.hero{background:linear-gradient(135deg,#0b4169,#0c7f8f);color:#fff;padding:28px 18px 22px;overflow:hidden;position:relative}
.hero:after{content:"";position:absolute;width:330px;height:330px;border-radius:50%;background:rgba(255,255,255,.06);right:-100px;top:-170px}
.hero-inner{max-width:1120px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:18px;position:relative;z-index:1}
.eyebrow{font-weight:800;opacity:.85;font-size:13px;letter-spacing:.8px}

.subtitle{opacity:.9;font-weight:700}

.hero-chips{max-width:1120px;margin:18px auto 0;display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.hero-chips span{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);padding:7px 10px;border-radius:99px;font-size:13px;font-weight:800}
.container{max-width:1120px;margin:18px auto 44px;padding:0 14px;display:grid;gap:16px}
.card{background:var(--card);border:1px solid #e5edf3;border-radius:20px;padding:20px;box-shadow:var(--shadow)}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.section-title.compact{margin-bottom:10px}
.kicker{font-size:10px;font-weight:900;color:#5d91ad;letter-spacing:1.4px}
h2{margin:2px 0 0;font-size:21px;font-weight:950}
.status{padding:5px 9px;border-radius:999px;font-size:12px;font-weight:900}
.status.online{background:#e7f7ef;color:#22774c}.status.offline{background:#fdecec;color:#9e4141}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid .full{grid-column:1/-1}
label span{display:block;font-size:13px;color:var(--muted);font-weight:900;margin:0 0 6px}
input,select{width:100%;border:1px solid #cfdde7;background:#fff;border-radius:13px;padding:12px 13px;color:var(--text);outline:none}

.steps-input{position:relative}.steps-input input{padding-right:48px}.steps-input b{position:absolute;right:15px;top:50%;transform:translateY(-50%);color:#71899b}

.micro{font-size:11px;color:#7d91a0;margin-top:8px;line-height:1.5}

.metric{background:#fff;border:1px solid #e4edf3;border-radius:17px;padding:16px;box-shadow:var(--shadow)}

.member-card .name{font-weight:950}.member-card .big{font-size:25px;font-weight:950;margin:6px 0 1px}.member-card .sub{font-size:11px;color:var(--muted)}

.cell-ok{background:#e8f7ef;color:#26754e;font-weight:900}.cell-low{background:#fff0e8;color:#a55e25;font-weight:900}.cell-none{color:#b7c4cd}

@media (max-width:850px){

/* =========================================================
   RESPONSIVE FIX v2
   防止 Grid / 圖表 / 表格把整個頁面撐出螢幕
========================================================= */
html, body {
  width: 100%;
  max-width: 100%;
  overflow-x: hidden;
}

body {
  min-width: 0;
}

.hero,
.container,
.card,
.entry-card,
.metrics-grid,
.metric,
.team-summary,
.summary-box,
.member-cards,
.member-card,
.two-col,

.trend-wrap,
.heatmap-wrap,
.form-grid,
.form-grid > label,
.section-title {
  min-width: 0;
  max-width: 100%;
}

.hero {
  width: 100%;
}

.hero-inner,
.hero-chips {
  width: min(1120px, calc(100% - 28px));

}

  width: min(1120px, calc(100% - 28px));
  max-width: 1120px;
  margin: 18px auto 44px;
  padding: 0;
}

.form-grid {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.form-grid .full {
  min-width: 0;
}

input,
select,
button {
  min-width: 0;
  max-width: 100%;
}

input[type="date"] {
  width: 100%;
}

.metrics-grid {
  grid-template-columns: repeat(4, minmax(0, 1fr));
}

.team-summary {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.member-cards {
  grid-template-columns: repeat(5, minmax(0, 1fr));
}

.two-col {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

/* 圖表僅在自己的容器內捲動，不影響整頁 */
.trend-wrap {
  width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
}

.trend-svg {
  display: block;
  width: 100%;
  min-width: 680px;
  max-width: none;
}

/* 30日總覽只在表格區塊左右滑 */
.heatmap-wrap {
  width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
}

.heatmap-wrap table {
  width: max-content;
  min-width: 100%;
}

/* 卡片文字避免撐開 */
.metric,
.member-card,
.summary-box,
.coach-item,
.advice-box {
  overflow-wrap: anywhere;
  word-break: break-word;
}

<script>
/* ===== 只要修改這一行 =====
   Apps Script 部署完成後，把 /exec 網址貼在引號內 */
window.APP_CONFIG = {
  API_URL: "https://script.google.com/macros/s/AKfycbw7xTwwzrVYeYSjRiLEMEXdwakY8dXbITcC0AeNbHO7DPxruQ0R9bxK1leEHNdikMArkg/exec"

<script>
const MEMBERS = ["方素秋","紀宗瀚","莊淑欽","周暄婕","陳又菁"];
const START = "2026-10-26";
const END = "2026-11-25";
const TARGET = 7000;
const TARGET_DAYS = 20;
let state = {records:[], today:"", config:null};

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const roc = iso => { const [y,m,d]=iso.split("-").map(Number); return `${y-1911}/${m}/${d}`; };
const fmt = n => Number(n||0).toLocaleString("zh-TW");
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));

function datesBetween(a,b){
  const out=[]; let d=new Date(a+"T00:00:00");
  const e=new Date(b+"T00:00:00");
  while(d<=e){out.push(d.toISOString().slice(0,10)); d.setDate(d.getDate()+1);}
  return out;
}
const ALL_DATES = datesBetween(START, END);

function init(){
  MEMBERS.forEach(n=>{
    $("#member").insertAdjacentHTML("beforeend",`<option>${n}</option>`);
    $("#trendMember").insertAdjacentHTML("beforeend",`<option>${n}</option>`);
  });
  const now = new Date();
  const local = new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,10);
  $("#date").value = local<START?START:(local>END?END:local);
  $("#steps").addEventListener("input",liveAdvice);
  $("#saveBtn").addEventListener("click",saveEntry);
  $("#refreshBtn").addEventListener("click",loadData);
  $("#trendMember").addEventListener("change",renderAll);
  window.addEventListener("online",updateOnline);
  window.addEventListener("offline",updateOnline);
  updateOnline();
  if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
  loadData();
}

function updateOnline(){
  const el=$("#onlineBadge");
  el.textContent=navigator.onLine?"已連線":"離線";
  el.className="status "+(navigator.onLine?"online":"offline");
}

function liveAdvice(){
  const steps=Number($("#steps").value||0), box=$("#liveAdvice");
  if(!$("#steps").value){box.className="advice-box neutral";box.textContent="輸入步數後，我會立即告訴你今天是否達標。";return}
  if(steps>=TARGET){
    box.className="advice-box good";
    box.textContent=`今日已達標！超過目標 ${fmt(steps-TARGET)} 步。`;
  }else{
    box.className="advice-box warn";
    box.textContent=`距離 7,000 步還差 ${fmt(TARGET-steps)} 步。`;
  }
}

function apiUrl(){
  const u=(window.APP_CONFIG||{}).API_URL||"";
  if(!u || u.includes("PASTE_")) throw new Error("尚未在 config.js 設定 Apps Script Web App 網址。");
  return u;
}

function jsonp(params={}){
  return new Promise((resolve,reject)=>{
    let url;
    try{ url=apiUrl(); }catch(e){ reject(e); return; }
    const cb="cb_"+Date.now()+"_"+Math.floor(Math.random()*10000);
    const q=new URLSearchParams({...params,callback:cb,_:Date.now()});
    const s=document.createElement("script");
    const timer=setTimeout(()=>cleanup(new Error("讀取逾時，請確認 Apps Script 部署權限。")),12000);
    function cleanup(err,data){
      clearTimeout(timer); delete window[cb]; s.remove();
      err?reject(err):resolve(data);
    }
    window[cb]=(data)=>cleanup(null,data);
    s.onerror=()=>cleanup(new Error("無法連線 Apps Script API。"));
    s.src=url+(url.includes("?")?"&":"?")+q.toString();
    document.body.appendChild(s);
  });
}

async function loadData(){
  try{
    setBusy(true);
    const data=await jsonp({action:"data"});
    if(data && data.ok===false) throw new Error(data.message||"讀取失敗");
    state=data;
    renderAll();
  }catch(e){
    showToast(e.message);
    state.records=JSON.parse(localStorage.getItem("peak-cache")||"[]");
    renderAll();
  }finally{setBusy(false)}
}

async function saveEntry(){
  const name=$("#member").value;
  const date=$("#date").value;
  const steps=Number($("#steps").value);

  if(!date || !Number.isFinite(steps) || steps<0 || !Number.isInteger(steps)){
    showToast("請確認日期與步數。");
    return;
  }

  if(date<START || date>END){
    showToast("日期須介於 10/26 至 11/25。");
    return;
  }

  try{
    setBusy(true);

    // 直接使用 JSONP 寫入，跨 GitHub Pages / Apps Script 不受 CORS 阻擋，
    // 且可以直接取得後端成功或錯誤訊息。
    const result=await jsonp({
      action:"save",
      name:name,
      date:date,
      steps:String(steps)
    });

    if(!result || result.ok===false){
      throw new Error((result && result.message) || "儲存失敗");
    }

    const data=await jsonp({action:"data"});
    if(!data || data.ok===false){
      throw new Error((data && data.message) || "資料已寫入，但重新讀取失敗。");
    }

    state=data;
    $("#steps").value="";
    liveAdvice();
    renderAll();

    showToast(result.message || `${name}｜${roc(date)}｜${fmt(steps)} 步，已儲存。`);

  }catch(e){
    showToast("儲存失敗："+e.message);
  }finally{
    setBusy(false);
  }
}

function setBusy(b){$("#saveBtn").disabled=b;$("#refreshBtn").disabled=b;$("#saveBtn").textContent=b?"處理中…":"儲存今日步數"}

function mapRecords(){
  const map=new Map();
  (state.records||[]).forEach(r=>map.set(`${r.name}|${r.date}`,r));
  return map;
}

function memberStats(name){
  const rs=(state.records||[]).filter(r=>r.name===name).sort((a,b)=>a.date.localeCompare(b.date));
  const q=rs.filter(r=>Number(r.steps)>=TARGET).length;
  const total=rs.reduce((s,r)=>s+Number(r.steps||0),0);
  return {name,records:rs,logged:rs.length,qualified:q,total,avg:rs.length?Math.round(total/rs.length):0,remaining:Math.max(0,TARGET_DAYS-q)};
}

function elapsedInfo(){
  const today=state.today||new Date().toISOString().slice(0,10);
  if(today<START) return {elapsed:0,remaining:ALL_DATES.length};
  if(today>END) return {elapsed:ALL_DATES.length,remaining:0};
  const elapsed=ALL_DATES.filter(d=>d<=today).length;
  return {elapsed,remaining:ALL_DATES.length-elapsed};
}

function adviceFor(st){
  if(st.qualified>=TARGET_DAYS) return "已完成20日門檻，後續持續維持即可。";
  const e=elapsedInfo(), need=TARGET_DAYS-st.qualified;
  const daysLeft=e.remaining + (state.today>=START&&state.today<=END?0:0);
  if(e.elapsed===0) return "活動尚未開始，先確認手機與穿戴裝置可正常記錄。";
  if(daysLeft<=0) return `活動已結束，最終達標 ${st.qualified} 日。`;
  const rate=need/daysLeft;
  if(rate<=0.55) return `節奏穩定，剩餘期間再完成 ${need} 日即可。`;
  if(rate<=0.8) return `建議提高穩定度，剩餘 ${daysLeft} 日需再達標 ${need} 日。`;
  return `進度偏緊，剩餘 ${daysLeft} 日需達標 ${need} 日，建議盡量每天完成。`;
}

function renderAll(){
  localStorage.setItem("peak-cache",JSON.stringify(state.records||[]));
  const stats=MEMBERS.map(memberStats);
  const total=stats.reduce((s,x)=>s+x.total,0);
  const qsum=stats.reduce((s,x)=>s+x.qualified,0);
  const done=stats.filter(x=>x.qualified>=TARGET_DAYS).length;
  const today=state.today||new Date().toISOString().slice(0,10);
  const todayRs=(state.records||[]).filter(r=>r.date===today);
  const todayQ=todayRs.filter(r=>Number(r.steps)>=TARGET).length;

  $("#metrics").innerHTML=[
    ["團隊累積步數",fmt(total),"5人總和"],
    ["累積達標人日",`${qsum} 日`,`滿分門檻共100人日`],
    ["已完成20日",`${done} / 5 人`,"5人皆完成才具排名資格"],
    ["今日已登記",`${todayRs.length} / 5 人`,`${todayQ} 人今日達標`]
  ].map(([k,v,s])=>`<div class="metric"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join("");

  const minQ=Math.min(...stats.map(x=>x.qualified));
  $("#teamSummary").innerHTML=`
    <div class="summary-box"><b>${minQ} 日</b><span>目前團隊最低達標日數</span></div>
    <div class="summary-box"><b>${done===5?"具資格":"尚未完成"}</b><span>團隊排名資格</span></div>
    <div class="summary-box"><b>${roc(today)}</b><span>系統資料日期</span></div>`;

  $("#memberCards").innerHTML=stats.map(st=>{
    const pct=clamp(st.qualified/TARGET_DAYS*100,0,100);
    return `<div class="member-card">
      <div class="name">${esc(st.name)}</div>
      <div class="big">${st.qualified}<small> / 20日</small></div>
      <div class="sub">已登記 ${st.logged} 日｜平均 ${fmt(st.avg)} 步</div>
      <div class="progress-track"><span style="width:${pct}%"></span></div>
      <div class="tip">${esc(adviceFor(st))}</div>
    </div>`;
  }).join("");

  renderBars("#progressChart",stats.map(x=>({label:x.name,value:x.qualified,max:TARGET_DAYS,text:`${x.qualified}/20 日`})));
  const maxAvg=Math.max(TARGET,...stats.map(x=>x.avg),1);
  renderBars("#avgChart",stats.map(x=>({label:x.name,value:x.avg,max:maxAvg,text:`${fmt(x.avg)} 步`})));
  renderTrend($("#trendMember").value||MEMBERS[0]);
  renderHeatmap();
  renderCoach(stats,todayRs,todayQ);
}

function renderBars(sel,rows){
  $(sel).innerHTML=rows.map(r=>`<div class="bar-row">
    <div class="bar-label">${esc(r.label)}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${clamp(r.value/r.max*100,0,100)}%"></div></div>
    <div class="bar-value">${r.text}</div>
  </div>`).join("");
}

function renderTrend(name){
  const map=mapRecords();
  const vals=ALL_DATES.map(d=>map.get(`${name}|${d}`)?.steps ?? null);
  const W=900,H=240,pL=48,pR=18,pT=18,pB=38;
  const max=Math.max(10000,...vals.filter(v=>v!=null),TARGET);
  const x=i=>pL+i*(W-pL-pR)/(ALL_DATES.length-1);
  const y=v=>pT+(max-v)*(H-pT-pB)/max;
  let path="",started=false;
  vals.forEach((v,i)=>{ if(v==null){started=false;return} const cmd=started?"L":"M"; path+=`${cmd}${x(i).toFixed(1)},${y(v).toFixed(1)} `; started=true; });
  const dots=vals.map((v,i)=>v==null?"":`<circle class="trend-dot" cx="${x(i)}" cy="${y(v)}" r="3.5"><title>${roc(ALL_DATES[i])} ${fmt(v)}步</title></circle>`).join("");
  const labels=ALL_DATES.map((d,i)=>i%5===0?`<text class="trend-label" x="${x(i)}" y="${H-12}" text-anchor="middle">${d.slice(5).replace("-","/")}</text>`:"").join("");
  $("#trendChart").innerHTML=`<svg viewBox="0 0 ${W} ${H}" class="trend-svg" role="img">
    <line class="axis" x1="${pL}" y1="${H-pB}" x2="${W-pR}" y2="${H-pB}"/>
    <line class="trend-target" x1="${pL}" y1="${y(TARGET)}" x2="${W-pR}" y2="${y(TARGET)}"/>
    <text class="trend-label" x="${pL+5}" y="${y(TARGET)-6}">7,000 目標線</text>
    <path class="trend-line" d="${path}"/>${dots}${labels}
  </svg>`;
}

function renderHeatmap(){
  const map=mapRecords();
  let html=`<table><thead><tr><th>團員</th>${ALL_DATES.map(d=>`<th>${d.slice(5).replace("-","/")}</th>`).join("")}</tr></thead><tbody>`;
  MEMBERS.forEach(name=>{
    html+=`<tr><td>${esc(name)}</td>`;
    ALL_DATES.forEach(d=>{
      const r=map.get(`${name}|${d}`);
      if(!r) html+=`<td class="cell-none">—</td>`;
      else if(Number(r.steps)>=TARGET) html+=`<td class="cell-ok">${fmt(r.steps)}</td>`;
      else html+=`<td class="cell-low">${fmt(r.steps)}</td>`;
    });
    html+="</tr>";
  });
  html+="</tbody></table>";
  $("#heatmap").innerHTML=html;
}

function renderCoach(stats,todayRs,todayQ){
  const items=[];
  const e=elapsedInfo();
  if(e.elapsed===0){
    items.push("活動尚未開始。建議先請 5 位團員確認 JOiiSPORTS／穿戴裝置可正常記錄，10/26 起每天固定登記。");
  }else{
    if(todayRs.length<5) items.push(`今天目前已有 <strong>${todayRs.length}/5 人</strong>登記，尚有 ${5-todayRs.length} 人未登記。`);
    else items.push(`今天 <strong>5 人皆已完成登記</strong>，其中 ${todayQ} 人達到 7,000 步。`);
    const risk=stats.filter(s=>s.qualified<TARGET_DAYS && adviceFor(s).includes("偏緊")).map(s=>s.name);
    if(risk.length) items.push(`<strong>${risk.join("、")}</strong> 的20日進度較緊，建議優先提醒。`);
    const completed=stats.filter(s=>s.qualified>=TARGET_DAYS).map(s=>s.name);
    if(completed.length) items.push(`<strong>${completed.join("、")}</strong> 已完成20日門檻。`);
  }
  const min=Math.min(...stats.map(s=>s.qualified));
  items.push(`團隊排名資格採「5人全部達標」概念，目前最低達標為 <strong>${min} 日</strong>；團長追蹤時應優先看最低進度，而不是只看團隊平均。`);
  $("#coach").innerHTML=items.map(x=>`<div class="coach-item">${x}</div>`).join("");
}

let toastTimer;
function showToast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),3200)}
document.addEventListener("DOMContentLoaded",init);

</script>
